<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 44" width="220" height="44" fill="none">
  <defs>
    <linearGradient id="logoBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="proBadgeLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Modern Automotive Emblem Squircle -->
  <rect x="2" y="2" width="40" height="40" rx="10" fill="url(#logoBgLight)"/>
  <rect x="2.5" y="2.5" width="39" height="39" rx="9.5" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Sleek Aerodynamic Sports Coupe Silhouette -->
  <path d="M8 24.5 C8 23 9.5 21.5 12 21.2 L16.5 21 C18.5 17 21 13.8 25 13.5 L28.5 13.5 C31.8 13.5 34.2 16.5 35.5 20 L37.8 20.8 C39.5 21.5 40 22.8 40 24.2 C40 25.5 39 26.2 38 26.2 L35.5 26.2 A 3.6 3.6 0 0 0 28.5 26.2 L19.5 26.2 A 3.6 3.6 0 0 0 12.5 26.2 L8.5 26.2 C8.2 26.2 8 25.5 8 24.5 Z" fill="#ffffff"/>

  <!-- Dual Tinted Glass Windows with Sleek B-Pillar -->
  <path d="M24 15 L27.5 15 C29.5 15 31.2 17 32 19.5 L24 19.5 Z" fill="#1e40af" fill-opacity="0.8"/>
  <path d="M22.5 15 L17.5 18.5 C16.8 19 16.2 19.5 15.5 19.5 L22.5 19.5 Z" fill="#1e40af" fill-opacity="0.8"/>

  <!-- Precision Multi-Tone Alloy Wheels -->
  <circle cx="16" cy="26.2" r="3" fill="#0f172a" stroke="#ffffff" stroke-width="0.8"/>
  <circle cx="16" cy="26.2" r="1.1" fill="#60a5fa"/>
  <circle cx="32" cy="26.2" r="3" fill="#0f172a" stroke="#ffffff" stroke-width="0.8"/>
  <circle cx="32" cy="26.2" r="1.1" fill="#60a5fa"/>

  <!-- Integrated Dynamic Headlight Beam Accent -->
  <path d="M37.5 22.5 L40.5 22.5" stroke="#f97316" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Brand Typography -->
  <text x="52" y="29.5" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="22" letter-spacing="-0.5">
    <tspan fill="#0f172a">Auto</tspan><tspan fill="#2563eb">Market</tspan>
  </text>

  <!-- Polished PRO Micro-Badge -->
  <rect x="178" y="14" width="34" height="17" rx="4.5" fill="url(#proBadgeLight)"/>
  <text x="195" y="26" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="9.5" fill="#ffffff" text-anchor="middle" letter-spacing="0.8">PRO</text>
</svg>
