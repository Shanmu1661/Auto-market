<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <!-- Modern Automotive Brand Gradient -->
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="favSpeedGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Modern Automotive Emblem Squircle -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#favBg)"/>
  <rect x="2.5" y="2.5" width="43" height="43" rx="11.5" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.2"/>

  <!-- Centered / scaled car silhouette and accents -->
  <g transform="translate(2, 2)">
    <!-- Speed Motion Streaks -->
    <path d="M6 14 L13 14" stroke="url(#favSpeedGlow)" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M4.5 17.5 L9.5 17.5" stroke="url(#favSpeedGlow)" stroke-width="1.3" stroke-linecap="round"/>

    <!-- Sleek Aerodynamic Sports Coupe Silhouette -->
    <path d="M8.5 25.2 C8.5 23.8 9.8 22.2 12.2 21.6 L16.8 20.8 C18.8 16.6 21.4 13.5 25.8 13.2 L29.2 13.2 C32.8 13.2 35.2 16.2 36.6 20.2 L38.6 21.2 C40.2 22 40.8 23.2 40.8 24.6 C40.8 25.8 39.8 26.5 38.6 26.5 L35.8 26.5 A 3.6 3.6 0 0 0 28.6 26.5 L19.2 26.5 A 3.6 3.6 0 0 0 12 26.5 L8.8 26.5 C8.6 26.5 8.5 25.9 8.5 25.2 Z" fill="#ffffff"/>

    <!-- Dual Tinted Glass Windows -->
    <path d="M24.8 14.8 L28.2 14.8 C30.6 14.8 32.2 17 33.2 19.8 L24.8 19.8 Z" fill="#0f172a" fill-opacity="0.85"/>
    <path d="M23.2 14.8 L18 18.8 C17.2 19.4 16.5 19.8 15.6 19.8 L23.2 19.8 Z" fill="#0f172a" fill-opacity="0.85"/>

    <!-- Precision Alloy Wheels -->
    <circle cx="15.6" cy="26.5" r="3.2" fill="#0f172a" stroke="#ffffff" stroke-width="0.9"/>
    <circle cx="15.6" cy="26.5" r="1.2" fill="#38bdf8"/>
    <circle cx="32.2" cy="26.5" r="3.2" fill="#0f172a" stroke="#ffffff" stroke-width="0.9"/>
    <circle cx="32.2" cy="26.5" r="1.2" fill="#38bdf8"/>

    <!-- Integrated Dynamic Headlight Beam Accent -->
    <path d="M38.5 22.8 L41.5 22.8" stroke="#f97316" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
